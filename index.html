<html lang="fr">
<head>

<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face{font-family:"Archivo Narrow";font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/archivo-narrow.woff2") format("woff2")}
:root{
  --paper:#F2EDE3;
  --ink:#14120F;
  --grey:#6E675C;
  --hair:#DCD3C4;
  --accent:#E8452A;
  --pad:clamp(18px,3.4vw,52px);
  --ease:cubic-bezier(.2,.6,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Inter Tight",-apple-system,Helvetica,Arial,sans-serif;
  font-weight:400;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink);color:#fff}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.mono{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- nav ---------- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
  padding:18px var(--pad);color:#fff;
  border-bottom:1px solid transparent;
  transition:background .3s var(--ease),border-color .3s var(--ease),padding .3s var(--ease);
}
nav.solid{background:rgba(242,237,227,.975);backdrop-filter:blur(14px);color:var(--ink);border-bottom-color:var(--hair);padding-top:13px;padding-bottom:13px}
.wordmark{display:block;justify-self:start}
.wordmark img{height:clamp(24px,2.6vw,34px);width:auto;display:block}
.wordmark .logo-ink{display:none}
nav.solid .logo-ink{display:block}
nav.solid .logo-white{display:none}
.navlinks{display:flex;gap:26px;justify-self:center;color:inherit}
.navlinks a{opacity:1}
.navlinks a:hover{opacity:1}
.nav-right{justify-self:end;opacity:.7}

/* ---------- hero ---------- */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;background:#0b0a09;color:#fff}
.hero-media,.hero-media video{position:absolute;inset:0;width:100%;height:100%}
.hero-media video{object-fit:cover}
.hero-scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(44% 38% at 50% 47%,rgba(0,0,0,.40),rgba(0,0,0,0) 72%),
    linear-gradient(180deg,rgba(0,0,0,.58) 0%,rgba(0,0,0,.12) 26%,rgba(0,0,0,0) 52%,rgba(0,0,0,.66) 100%)}
.hero-meta{position:absolute;left:var(--pad);bottom:clamp(72px,8vw,104px);display:flex;gap:clamp(14px,2.4vw,34px);color:rgba(255,255,255,.82)}
.hero-card{position:absolute;right:var(--pad);bottom:clamp(104px,10vw,132px);text-align:right}
.hero-logo{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:clamp(250px,31vw,470px);aspect-ratio:572/207;z-index:3;
  background:var(--logo-c,#fff);
  -webkit-mask:url("assets/logo_vector.svg") center/contain no-repeat;
  mask:url("assets/logo_vector.svg") center/contain no-repeat;
  transition:background-color 1.15s cubic-bezier(.45,0,.15,1);
  filter:drop-shadow(0 8px 40px rgba(0,0,0,.55))}
.hero-card .sub{display:block;margin-top:12px;opacity:.78;font-size:10px;letter-spacing:.18em}
.hero-card .mono{display:block;color:rgba(255,255,255,.7);margin-bottom:8px}
.hero-card strong{
  font-family:"Bricolage Grotesque",Helvetica,Arial,sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(36px,5vw,80px);line-height:.9;letter-spacing:-.04em;display:block;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero-down{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;color:rgba(255,255,255,.55);transition:color .3s}
.hero-down:hover{color:#fff}

section[id],header[id]{scroll-margin-top:0}

/* ---------- marquee ---------- */
.marquee{margin-top:clamp(28px,3.4vw,48px);background:var(--accent);overflow:hidden;padding:10px 0}
.marquee div{display:flex;gap:38px;width:max-content;animation:slide 44s linear infinite}
.marquee span{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);white-space:nowrap}
.marquee span b{color:#fff;font-weight:500}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---------- section heads ---------- */
section{padding:clamp(56px,8vw,120px) var(--pad)}
.more{position:static;margin-left:auto;align-self:baseline;color:var(--grey);white-space:nowrap;text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:3px;transition:color .3s var(--ease),border-color .3s var(--ease)}
.more:hover{color:var(--accent);border-color:var(--accent)}
.head{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--hair);margin-bottom:clamp(24px,3.4vw,44px)}
.head h2{font-family:"Bricolage Grotesque",Helvetica,Arial,sans-serif;font-weight:700;font-size:clamp(28px,4vw,50px);line-height:1;letter-spacing:-.04em}
.head .mono{color:var(--grey)}

/* ---------- work ---------- */
.work{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(18px,2.4vw,38px) clamp(12px,1.8vw,26px)}
.item{grid-column:span 6;display:block}
.item.wide{grid-column:span 12}
.item .frame{position:relative;overflow:hidden;background:var(--hair);aspect-ratio:16/10}
.item.wide .frame{aspect-ratio:16/9}
.item .frame img{transition:transform 1.1s var(--ease),opacity .45s var(--ease);object-position:50% 32%}
.item .vid{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .5s var(--ease);pointer-events:none;background:#000}
.item .frame.playing .vid{opacity:1}
.item .frame.playing img{opacity:0}
.item .frame.zoom img{transform:scale(1.14) translate(-1.5%,-2%);transition:transform 5.5s cubic-bezier(.2,.6,.2,1)}
.item .frame.zoom .playbtn{opacity:0}
.item .playbtn{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:7px;color:#fff;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.6);transition:opacity .3s}
.item .playbtn::before{content:"";width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.8);display:block}
.item .playbtn::after{content:"";position:absolute;left:8px;width:0;height:0;border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.item:hover .playbtn{opacity:0}
.item:hover .frame img{transform:scale(1.03)}
.item .cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:11px;border-top:1px solid transparent;transition:border-color .4s var(--ease)}
.item:hover .cap{border-color:var(--ink)}
.item .cap .who{font-size:15px;font-weight:500;letter-spacing:-.01em}
.item .cap .what{color:var(--grey);font-size:13.5px;flex:1}
.item .cap .what::before{content:"— "}
.item .cap .num{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--grey)}
.item .meta{display:block;margin-top:3px;color:var(--grey)}
.item .meta span:first-child::after{content:" · "}
.item .meta span{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}


/* ---------- index de films ---------- */
.index{border-top:1px solid var(--hair)}
.index .row{
  display:grid;grid-template-columns:44px minmax(0,1.15fr) minmax(0,1fr) auto 52px;gap:clamp(10px,2vw,26px);
  align-items:baseline;padding:clamp(9px,1.1vw,14px) 0;border-bottom:1px solid var(--hair);
  position:relative;transition:opacity .35s var(--ease),padding-left .45s var(--ease);
}
.index:hover .row{opacity:.35}
.index .row:hover{opacity:1;padding-left:14px}
.index .row:hover .t{color:var(--accent)}
.index .n{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--grey)}
.index .t{font-family:"Bricolage Grotesque",Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(22px,2.7vw,36px);line-height:1;letter-spacing:-.035em;transition:color .3s var(--ease)}
.index .s{color:var(--grey);font-size:14px}
.index .k,.index .y{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.index .thumb{display:none}

.preview{
  position:fixed;top:0;left:0;width:clamp(260px,26vw,420px);aspect-ratio:16/9;z-index:30;
  pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.9) rotate(-2deg);
  transition:opacity .35s var(--ease),transform .5s var(--ease);overflow:hidden;background:#111;
}
.preview{clip-path:inset(0 100% 0 0);transition:opacity .3s var(--ease),clip-path .34s var(--ease)}
.preview.on{clip-path:inset(0 0 0 0);opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-1.5deg)}
.preview img{width:100%;height:100%;object-fit:cover;transition:opacity .3s var(--ease)}
.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s var(--ease)}
.preview .tc{position:absolute;right:10px;bottom:9px;color:#fff;font-size:9px;letter-spacing:.14em;opacity:.85}
.preview .tag{position:absolute;left:10px;bottom:9px;color:#fff;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase}

@media(max-width:900px){
  .preview{display:none}
  .index:hover .row{opacity:1}
  .index .row{grid-template-columns:30px 1fr auto;grid-template-rows:auto auto;row-gap:1px;padding:8px 0}
  .index .n{grid-column:1;grid-row:1}
  .index .t{grid-column:2;grid-row:1}
  .index .y{grid-column:3;grid-row:1}
  .index .s{display:block;grid-column:2 / 4;grid-row:2;font-family:"Inter Tight",sans-serif;font-size:11.5px;letter-spacing:.01em;color:var(--grey)}
  .index .k{display:none}
  .index .thumb{display:none}
  .about{gap:16px}
  .about .ph{display:none}
  .lead{font-size:19px;margin-bottom:14px}
  .credits{font-size:9px}
  .mail{font-size:clamp(26px,8vw,40px)}
  .foot{flex-direction:column;gap:6px;font-size:9px}
}


/* ---------- bande pleine largeur ---------- */
.fullbleed{padding:0 0 clamp(40px,6vw,86px)}
.fullbleed figure{margin:0}
.fullbleed img{width:100%;height:clamp(300px,58vw,720px);object-fit:cover;object-position:50% 20%}
.fullbleed figcaption{color:var(--grey);padding:11px var(--pad) 0}

/* ---------- statement ---------- */
.statement{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--paper)}
.statement .in{padding:clamp(52px,7vw,104px) var(--pad);display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px)}
.statement p.big{font-family:"Bricolage Grotesque",Helvetica,sans-serif;font-weight:600;font-size:clamp(26px,3.6vw,50px);line-height:1.1;letter-spacing:-.02em}
.statement p.big i{color:var(--accent);font-style:italic}
.statement .txt p{font-size:15px;line-height:1.75;color:#3b3b38;margin-bottom:16px;max-width:46ch}
.statement .txt .mono{color:var(--grey);display:block;margin-bottom:18px}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:5fr 7fr;gap:clamp(24px,4vw,64px);align-items:start}
.about .ph{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--hair)}
.about .txt h3{font-family:"Bricolage Grotesque",Helvetica,sans-serif;font-weight:600;font-size:clamp(26px,3vw,40px);line-height:1.04;letter-spacing:-.02em;margin-bottom:18px}
.about .txt p{font-size:15px;line-height:1.75;color:#3b3b38;margin-bottom:14px;max-width:52ch}
.credits{margin-top:28px;border-top:1px solid var(--hair)}
.credits div{display:grid;grid-template-columns:1fr auto;gap:14px;padding:10px 0;border-bottom:1px solid var(--hair);font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.credits div b{color:var(--ink);font-weight:500}

/* ---------- contact ---------- */
.contact{padding-bottom:92px}
.contact .more{position:static;margin-left:auto;align-self:baseline;color:var(--grey);white-space:nowrap;text-decoration:none;border-bottom:1px solid var(--hair);padding-bottom:3px;transition:color .3s var(--ease),border-color .3s var(--ease)}
.more:hover{color:var(--accent);border-color:var(--accent)}
.head{margin-bottom:clamp(28px,4vw,54px)}
.mail{align-self:flex-start;width:fit-content;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(30px,6.2vw,78px);line-height:1;letter-spacing:-.045em;display:inline-block;border-bottom:2px solid var(--ink);padding-bottom:6px}
.mail:hover{color:var(--accent);border-color:var(--accent)}
.rows{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,3vw,40px);margin-top:clamp(36px,5vw,68px);padding-top:20px;border-top:1px solid var(--hair)}
.rows div{color:var(--grey)}
.rows b{display:block;color:var(--ink);font-weight:500;margin-top:6px;font-family:"Inter Tight",sans-serif;font-size:14px;letter-spacing:0;text-transform:none}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(40px,6vw,86px);padding:16px 0 20px;border-top:1px solid var(--hair);color:var(--grey)}

.rv{opacity:1;transform:none}

@media(max-width:900px){
  .navlinks{display:flex;gap:14px;font-size:9px;letter-spacing:.08em}
  nav{gap:10px}
  .nav-right{display:none}
  .hero-card{left:var(--pad);right:auto;text-align:left;bottom:64px}
  .hero-meta{left:var(--pad);bottom:156px;flex-direction:column;gap:4px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero-down{display:none}
  nav{padding:12px var(--pad) 11px;align-items:center}
  .wordmark img{height:26px}
  .hero-top{display:block;line-height:1.9}
  .hero-top span{display:block}
  .hero-top .r{text-align:left;margin-top:6px}
  h1{font-size:clamp(52px,15vw,120px)}
  .hero-sub{grid-template-columns:1fr}
  .hero-sub .note{justify-self:start;text-align:left}
  .hero-img{aspect-ratio:4/3}
  .work{grid-template-columns:1fr}
  .item,.item.wide{grid-column:1}
  .item .frame,.item.wide .frame{aspect-ratio:4/3}
  .statement .in,.about{grid-template-columns:1fr}
  .rows{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}



/* ---------- entrée des chapitres ---------- */
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.index .row.rv{transition:opacity .6s var(--ease),transform .6s var(--ease),padding-left .45s var(--ease)}

/* ---------- bandeau de déroulé du montage ---------- */
.legal-cover{font-family:"Archivo Black",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.045em;font-size:8.5px;color:rgba(255,255,255,.66);white-space:nowrap}
.reelbar{position:absolute;left:var(--pad);right:var(--pad);bottom:62px;z-index:3;color:#fff}
.rb-line{height:1px;background:rgba(255,255,255,.28);position:relative;overflow:hidden}
.rb-line i{position:absolute;inset:0 auto 0 0;width:0;background:#fff;transition:width .25s linear}
.rb-row{display:flex;justify-content:space-between;gap:18px;margin-top:9px;color:rgba(255,255,255,.82)}
#rb-title{font-family:"Archivo Black",sans-serif;font-weight:400;opacity:.95;text-transform:uppercase;letter-spacing:.015em;font-size:10.5px;line-height:1.1}
@media(max-width:900px){
  .reelbar{bottom:96px}
  .rb-row{font-size:9px;gap:10px}
}

/* ---------- chapitres plein écran ---------- */
.foot{display:flex;justify-content:space-between;gap:20px;margin-top:auto;padding-top:26px;border-top:1px solid var(--hair);color:var(--grey)}
.lead{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:clamp(21px,2.3vw,30px);line-height:1.22;letter-spacing:-.025em;margin-bottom:20px;color:var(--ink)}
html{scroll-snap-type:y mandatory;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:var(--paper)}
.chapter{height:100svh;min-height:560px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:86px var(--pad) 92px;position:relative;overflow:hidden}
.chapbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;align-items:center;justify-content:space-between;
  padding:10px var(--pad) 12px;color:var(--ink)}
.chapbar::before{display:none}
.chapbar.light{color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.6)}

.chapbar .now{display:flex;align-items:baseline;gap:12px}
.chapbar .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;line-height:1}
.chapbar .lbl{opacity:.75}
.chapbar .arrows{display:flex;gap:16px}
.chapbar button{background:none;border:0;color:inherit;cursor:pointer;font:inherit;opacity:.6;padding:2px 0;transition:opacity .2s}
.chapbar button:hover{opacity:1}
.chapbar button:disabled{opacity:.2;cursor:default}
@media(max-width:900px){
  .chapter{padding:74px var(--pad) 84px}
  .chapbar{padding:8px var(--pad) 10px}
}

/* nav : Archivo Narrow capitales */
header nav a,.navlinks a,#nav .navlinks a{font-family:"Archivo Narrow",sans-serif!important;font-weight:700!important;text-transform:uppercase;letter-spacing:.07em;font-size:clamp(12px,1.05vw,14px)!important}
header nav a:hover,header nav a[aria-current],.navlinks a:hover{color:var(--ink)}
</style>

<script>
const frames=[...document.querySelectorAll('.frame[data-yt]')];
const LOCAL = location.protocol === 'file:';
function play(f){
  if(LOCAL){ f.classList.add('zoom'); return; }
  if(f.classList.contains('playing')||f.dataset.loading)return;
  f.dataset.loading='1';
  const id=f.dataset.yt;
  const ifr=document.createElement('iframe');
  ifr.className='vid';
  ifr.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&mute=1&controls=0&loop=1&playlist='+id+'&modestbranding=1&rel=0&playsinline=1&start=6';
  ifr.allow='autoplay; encrypted-media; picture-in-picture';
  ifr.setAttribute('tabindex','-1');
  let ok=false;
  ifr.addEventListener('load',()=>{ ok=true; setTimeout(()=>{ if(f.contains(ifr)) f.classList.add('playing'); },350); });
  // si le lecteur ne répond pas, on garde l'affiche : jamais de cadre noir
  const garde=setTimeout(()=>{ if(!ok){ f.classList.remove('playing'); ifr.remove(); f.classList.add('zoom'); } delete f.dataset.loading; },3200);
  ifr.addEventListener('load',()=>clearTimeout(garde));
  f.appendChild(ifr);
}
function stop(f){
  f.classList.remove('zoom');
  delete f.dataset.loading;
  if(!f.classList.contains('playing'))return;
  f.classList.remove('playing');
  const v=f.querySelector('.vid');
  if(v)setTimeout(()=>v.remove(),500);
}
frames.forEach(f=>{
  f.addEventListener('mouseenter',()=>play(f));
  f.addEventListener('mouseleave',()=>stop(f));
  f.addEventListener('touchstart',()=>{frames.forEach(stop);play(f)},{passive:true});
});


/* entrée en cascade des chapitres */
(function(){
  const cibles=[...document.querySelectorAll('#films .head,#films .row,#contact .head,#contact .mail,#contact .rows,#contact .foot')];
  cibles.forEach(e=>e.classList.add('rv'));
  const io=new IntersectionObserver(es=>{
    es.forEach(en=>{
      if(!en.isIntersecting) return;
      const groupe=[...en.target.querySelectorAll('.rv')].filter(e=>!e.classList.contains('in'));
      const base=en.target.classList.contains('rv')?[en.target]:groupe;
      base.forEach((e,i)=>setTimeout(()=>e.classList.add('in'), 60*i));
      io.unobserve(en.target);
    });
  },{threshold:.15});
  document.querySelectorAll('.chapter').forEach(c=>io.observe(c));
})();

/* déroulé du montage : temps, plan en cours, progression */
(function(){
  const v=document.getElementById('reel'); if(!v) return;
  const fill=document.getElementById('rb-fill'), ti=document.getElementById('rb-title');
  // bornes de coupe et titres, dans l'ordre du montage
  const cuts=[[0,'Keblack — Bababa'],[3.0,'Naza & Ninho — Quillé'],[5.8,'Keblack & Franglish — Haut les mains'],[8.6,'Naza & Tiakola — Une histoire'],[11.4,'Keblack — Mood'],[14.6,'Keblack ft. Guy2Bezbar — Melrose Place']];
  // une couleur par plan : le logo prend celle du clip en cours
  const LOGO=document.querySelector('.hero-logo');
  const teintes=['#F27640','#42C7F0','#85B3D6','#D8B279','#D2AA4B','#3B85CE']; // prélevées sur les plans
  let last=-1;
  function maj(){
    const d=v.duration||17.4, c=v.currentTime;
    if(fill) fill.style.width=(c/d*100).toFixed(2)+'%';
    let k=0; for(let i=0;i<cuts.length;i++){ if(c>=cuts[i][0]) k=i; }
    if(k!==last){ last=k; LOGO.style.backgroundColor=teintes[k%teintes.length]; }
    ti.textContent=cuts[k][1];
  }
  v.addEventListener('timeupdate',maj); v.addEventListener('loadedmetadata',maj); maj();
  // si la vidéo ne démarre pas (autoplay bloqué), la couleur tourne quand même
  let sec=0;
  setInterval(()=>{
    if(!v.paused) return;
    sec=(sec+1)%teintes.length;
    if(LOGO) LOGO.style.backgroundColor=teintes[sec];
  },3400);
})();

/* nav : transparente sur le film, pleine ensuite */
(function(){
  const nav=document.getElementById('nav'); if(!nav) return;
  const seuil=()=>innerHeight*0.72;
  const maj=()=>nav.classList.toggle('solid', scrollY>seuil());
  addEventListener('scroll',maj,{passive:true}); setInterval(maj,300); maj();
})();

/* aperçu qui suit la souris sur l'index */
(function(){
  const idx=document.getElementById('index'), pv=document.getElementById('preview');
  if(!idx||!pv) return;
  const img=pv.querySelector('img');
  let x=0,y=0,tx=0,ty=0,on=false;
  if(matchMedia('(max-width:900px)').matches) return;
  let vid=null;
  function media(row){
    if(vid){ vid.pause(); vid.remove(); vid=null; }
    img.style.opacity='1'; if(tc) tc.textContent='00:00';
    const src=row.dataset.video;
    if(!src) return;
    const v=document.createElement('video');
    v.src=src; v.muted=true; v.loop=true; v.playsInline=true; v.preload='auto';
    v.addEventListener('canplay',()=>{ if(pv.contains(v)){ v.style.opacity='1'; img.style.opacity='0'; v.play().catch(()=>{}); } });
    v.addEventListener('timeupdate',()=>{ if(tc) tc.textContent='00:'+String(Math.floor(v.currentTime)).padStart(2,'0'); });
    v.addEventListener('error',()=>{ v.remove(); img.style.opacity='1'; });
    pv.appendChild(v); vid=v;
  }
  idx.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('mouseenter',()=>{ img.src=r.dataset.img; pv.classList.add('on'); on=true; pv.style.transform=`translate(${tx}px,${ty}px) translate(-50%,-50%) scale(1) rotate(-1.5deg)`; media(r); });
    r.addEventListener('mouseleave',()=>{ pv.classList.remove('on'); on=false; if(vid){ vid.pause(); vid.remove(); vid=null; } img.style.opacity='1'; });
  });
  addEventListener('mousemove',e=>{ tx=e.clientX; ty=e.clientY; });
  (function loop(){
    x+=(tx-x)*0.16; y+=(ty-y)*0.16;
    pv.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${on?1:0.92}) rotate(-1.5deg)`;
    requestAnimationFrame(loop);
  })();
  window.__idxReady = document.querySelectorAll('#index .row').length;
})();
</script>
