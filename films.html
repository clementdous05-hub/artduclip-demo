*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#F2EDE3; --ink:#14120F; --grey:#6E675C; --hair:#DCD3C4;
  --pad:clamp(18px,3.4vw,52px);
}
html{-webkit-font-smoothing:antialiased}
body{background:var(--paper);color:var(--ink);font-family:"Inter Tight",sans-serif;font-size:16px;line-height:1.45}
a{color:inherit;text-decoration:none}
.mono{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px var(--pad) 0}
header .wordmark{align-self:start;padding-top:10px;display:block}
header .wordmark img{height:clamp(26px,2.6vw,36px);width:auto;display:block}
header nav{display:flex;gap:26px;grid-column:3;justify-self:end;align-self:start;padding-top:13px;margin-right:calc(-1 * var(--sbw,0px))}
header nav a{color:var(--grey);transition:color .25s}
header nav a:hover,header nav a[aria-current]{color:var(--ink)}
header nav a[aria-current]{border-bottom:1px solid #F2EDE3;padding-bottom:2px}

main{padding:clamp(40px,6.4vw,88px) var(--pad) 0}
h1{font-family:"Archivo Black",sans-serif;font-weight:400;
  font-size:clamp(56px,9.4vw,148px);line-height:.88;letter-spacing:-.035em;text-transform:uppercase;
  margin-bottom:clamp(30px,4.6vw,64px)}

/* deux colonnes inégales, aucune image recadrée */
.mosaic{display:grid;grid-template-columns:1.12fr .95fr;column-gap:clamp(20px,3.2vw,58px);align-items:start}
.col{display:flex;flex-direction:column;gap:clamp(28px,3.8vw,68px)}
.col.two{padding-top:0}

a.film{display:block;width:100%}
a.film.s60{width:60%}
a.film.s64{width:64%}
a.film.s66{width:66%}
a.film.s70{width:70%}
a.film.s78{width:78%}
a.film.s84{width:84%}
a.film.s86{width:86%}
a.film.s88{width:88%}
a.film.s92{width:92%}
a.film.s100{width:100%}
a.film.r{margin-left:auto}
a.film.c{margin-inline:auto}

a.film video,a.film img{display:block;width:100%;height:auto;background:var(--hair)}
a.film .what{transition:color .25s}
a.film:hover .what{color:var(--ink)}
figcaption{padding-top:10px}
figcaption .who{display:block;font-family:"Archivo Black",sans-serif;font-weight:400;text-transform:uppercase;
  font-size:clamp(13px,.95vw,15px);letter-spacing:-.005em;line-height:1.3;padding-top:4px}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;

/* ---- ciel partagé ---- */
html{background:#1E5480}
body.sky{background:transparent}
.bg{position:fixed;left:-8vw;top:-8vh;width:116vw;height:116vh;z-index:-2;pointer-events:none;
  background:url("assets/img/ciel.jpg") center/cover no-repeat;
  transform:scale(1.02)}
.ciel-voile{position:fixed;inset:0;z-index:-1;pointer-events:none;background:transparent;
  transition:background 1.8s ease,opacity 1.8s ease}
.pluie{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;
  opacity:0;transition:opacity 1.1s ease;display:block}
.nuit-teinte{position:fixed;inset:0;z-index:-1;pointer-events:none;background:#0B1A4A;mix-blend-mode:color;opacity:0;transition:opacity 2.2s ease}
.etoiles{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 2.2s ease;
  background-image:
    radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.95),transparent 60%),
    radial-gradient(1px 1px at 28% 62%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1.4px 1.4px at 41% 27%,rgba(255,255,255,.8),transparent 60%),
    radial-gradient(1px 1px at 55% 74%,rgba(255,255,255,.6),transparent 60%),
    radial-gradient(1px 1px at 67% 12%,rgba(255,255,255,.75),transparent 60%),
    radial-gradient(1.2px 1.2px at 79% 45%,rgba(255,255,255,.85),transparent 60%),
    radial-gradient(1px 1px at 88% 81%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 6% 88%,rgba(255,255,255,.6),transparent 60%),
    radial-gradient(1px 1px at 34% 6%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 61% 51%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 93% 22%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1px 1px at 18% 41%,rgba(255,255,255,.35),transparent 60%);
  background-size:520px 520px;background-repeat:repeat;animation:scintille 9s ease-in-out infinite alternate}
@keyframes scintille{from{opacity:.85}to{opacity:1}}
.lune{position:fixed;right:6%;top:6.5%;width:40px;height:40px;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 38% 36%,#FFFDF3 0%,#F3EBD8 62%,#DED2B6 100%);
  box-shadow:0 0 26px 7px rgba(255,250,232,.30),0 0 84px 32px rgba(220,228,255,.16);
  opacity:0;transition:opacity 2.4s ease}
.grain{position:fixed;inset:-120px;z-index:-1;pointer-events:none;opacity:.34;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27220%27%20height=%27220%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.9%27%20numOctaves=%274%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3CfeComponentTransfer%3E%3CfeFuncR%20type=%27linear%27%20slope=%272.6%27%20intercept=%27-0.8%27/%3E%3CfeFuncG%20type=%27linear%27%20slope=%272.6%27%20intercept=%27-0.8%27/%3E%3CfeFuncB%20type=%27linear%27%20slope=%272.6%27%20intercept=%27-0.8%27/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect%20width=%27220%27%20height=%27220%27%20filter=%27url(%23n)%27/%3E%3C/svg%3E");background-size:220px 220px;background-repeat:repeat;
  animation:grains 1.1s steps(7) infinite;will-change:transform}
@keyframes grains{0%{transform:translate3d(0,0,0)}14%{transform:translate3d(-14px,9px,0)}28%{transform:translate3d(11px,-13px,0)}
  42%{transform:translate3d(-9px,-7px,0)}57%{transform:translate3d(13px,12px,0)}71%{transform:translate3d(-12px,6px,0)}
  85%{transform:translate3d(8px,-11px,0)}100%{transform:translate3d(0,0,0)}}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 78% 78% at 50% 46%,rgba(0,0,0,0) 52%,rgba(0,0,0,.20) 100%)}

<script>
/* les extraits tournent en boucle ; on ne lance que ce qui approche de l'écran */
(function(){
  const vids=[...document.querySelectorAll('a.film video')];
  function check(){
    vids.forEach(v=>{
      if(v.dataset.on) return;
      const r=v.getBoundingClientRect();
      if(r.top < innerHeight+300 && r.bottom > -300){ v.dataset.on='1'; v.play().catch(()=>{}); }
    });
  }
  addEventListener('scroll',check,{passive:true});
  check(); setTimeout(check,500);

/* pluie : rideaux dessines sur canvas, pilotes par l'etat du ciel */
(function(){
  var cv=document.querySelector('canvas.pluie'); if(!cv) return;
  var cx=cv.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2);
  var W=0,H=0,drops=[],actif=false,raf=0,force=1,dernier=0;
  function neuf(partout){
    var l=14+Math.random()*26;
    return {x:Math.random()*(W+160)-80, y:partout?Math.random()*H:-60,
            l:l, v:880+Math.random()*620, a:0.06+Math.random()*0.15, w:0.6+Math.random()*0.6};
  }
  function semer(){
    var n=Math.round((W*H)/2500*force), i; drops=[];
    for(i=0;i<n;i++) drops.push(neuf(true));
  }
  function taille(){
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
    semer();
  }
  function frame(t){
    if(!actif) return;
    var dt=Math.min((t-dernier)/1000||0.016,0.05); dernier=t;
    cx.clearRect(0,0,W,H);
    cx.lineCap='round';
    for(var i=0;i<drops.length;i++){
      var d=drops[i];
      d.y+=d.v*dt; d.x+=d.v*dt*0.22;
      if(d.y>H+60||d.x>W+80){ drops[i]=neuf(false); continue; }
      cx.strokeStyle='rgba(228,240,252,'+d.a+')';
      cx.lineWidth=d.w;
      cx.beginPath(); cx.moveTo(d.x,d.y); cx.lineTo(d.x-3.9,d.y+d.l*(force>1?1.2:1)); cx.stroke();
    }
    raf=requestAnimationFrame(frame);
  }
  function maj(){
    var etat=document.body.getAttribute('data-ciel');
    var on=(etat==='pluie'||etat==='orage');
    var f=(etat==='orage')?1.7:1;
    if(on&&f!==force){ force=f; semer(); }
    if(!on&&force!==1){ force=1; }
    cv.style.opacity=on?'1':'0';
    if(on&&!actif){ actif=true; dernier=performance.now(); raf=requestAnimationFrame(frame); }
    if(!on&&actif){ actif=false; cancelAnimationFrame(raf); cx.clearRect(0,0,W,H); }
  }
  window.addEventListener('resize',taille);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden&&actif){ actif=false; cancelAnimationFrame(raf); }
    else if(!document.hidden) maj();
  });
  taille();
  window.RAIN=maj;
  new MutationObserver(maj).observe(document.body,{attributes:true,attributeFilter:['data-ciel']});
  maj();
})();

})();
</script>
<script>
(function(){
  var PARIS={lat:48.8566,lon:2.3522};
  var voile=document.querySelector('.ciel-voile'), pluie=document.querySelector('.pluie'), bg=document.querySelector('.bg');
  var force=new URLSearchParams(location.search).get('ciel');
  var heureForce=parseFloat(new URLSearchParams(location.search).get('heure'));
  var _wx=new URLSearchParams(location.search).get('wx');
  var wxForce=_wx===null?null:parseInt(_wx,10);
  var _prec=/[?&]prec=([0-9.]+)/.exec(location.search);
  var precForce=_prec?parseFloat(_prec[1]):null;

  function hhmm(s){ if(!s) return null; var m=String(s).match(/T(\d{2}):(\d{2})/); return m?parseInt(m[1],10)+parseInt(m[2],10)/60:null; }
  function heureParis(){
    if(!isNaN(heureForce)) return heureForce;
    try{var h=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
      return parseInt(h.split(':')[0],10)+parseInt(h.split(':')[1],10)/60;}catch(e){var d=new Date();return d.getHours()+d.getMinutes()/60;}
  }
  function famille(code){
    if(code===0||code===1) return 'clair';
    if(code===2||code===3) return 'nuageux';
    if(code===45||code===48) return 'brouillard';
    if(code>=51&&code<=67) return 'pluie';
    if(code>=71&&code<=77) return 'neige';
    if(code>=80&&code<=82) return 'pluie';
    if(code>=85&&code<=86) return 'neige';
    if(code>=95) return 'orage';
    return 'nuageux';
  }
  var VOILES={
    clair:'transparent',
    nuageux:'linear-gradient(180deg,rgba(126,136,148,.30),rgba(110,120,134,.34))',
    brouillard:'linear-gradient(180deg,rgba(206,210,214,.46),rgba(196,200,206,.42))',
    pluie:'linear-gradient(180deg,rgba(58,70,86,.46),rgba(44,56,72,.52))',
    neige:'linear-gradient(180deg,rgba(214,224,234,.40),rgba(200,212,224,.38))',
    orage:'linear-gradient(180deg,rgba(32,38,54,.60),rgba(22,28,44,.66))',
    aube:'linear-gradient(0deg,rgba(255,178,120,.46) 0%,rgba(214,148,146,.30) 32%,rgba(92,96,140,.28) 68%,rgba(38,48,86,.40) 100%)',
    crepuscule:'linear-gradient(0deg,rgba(255,138,68,.48) 0%,rgba(206,104,86,.30) 34%,rgba(74,64,96,.34) 70%,rgba(24,28,58,.58) 100%)',
    nuit:'linear-gradient(180deg,rgba(6,10,30,.56),rgba(3,6,20,.66))'
  };
  var dernier=null;
  function applique(etat, veille){
    document.body.setAttribute('data-ciel',etat);
    if(etat===dernier && !veille) return;
    dernier=etat;
    voile.style.background=veille||VOILES[etat]||'transparent';
    if(window.RAIN) window.RAIN();
    bg.style.opacity='1';
  }
  /* phase deduite du soleil de Paris : lever et coucher reels du jour */
  function phase(lever,coucher){
    var h=heureParis();
    if(lever==null||coucher==null){
      if(h<5.5||h>=21.5) return 'nuit';
      if(h<8) return 'aube';
      if(h>=18&&h<20.5) return 'crepuscule';
      return 'clair';
    }
    if(h>=lever-0.75 && h<lever+0.75) return 'aube';
    if(h>=coucher-1.0 && h<coucher+0.5) return 'crepuscule';
    if(h>=lever+0.75 && h<coucher-1.0) return 'clair';
    return 'nuit';
  }
  var DUR={brouillard:1,pluie:1,neige:1,orage:1};
  var CHAUD={aube:'linear-gradient(0deg,rgba(255,172,120,.34) 0%,rgba(255,172,120,0) 42%)',
             crepuscule:'linear-gradient(0deg,rgba(255,132,70,.36) 0%,rgba(255,132,70,0) 42%)'};
  function rendu(ph,w){
    var base=VOILES[w]||'transparent';
    if(ph==='nuit'){
      return (w==='clair'||w==='nuageux') ? VOILES.nuit : VOILES.nuit+','+base;
    }
    if(DUR[w]) return CHAUD[ph]?(CHAUD[ph]+','+base):base;
    if(ph==='aube'||ph==='crepuscule') return w==='clair'?VOILES[ph]:(CHAUD[ph]+','+base);
    return base;
  }
  function meteo(){
    if(force){applique(force);return;}
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+PARIS.lat+'&longitude='+PARIS.lon+
          '&current=weather_code,cloud_cover,is_day,precipitation,rain,showers,snowfall,temperature_2m,wind_speed_10m,relative_humidity_2m&daily=sunrise,sunset,precipitation_sum,precipitation_probability_max&timezone=Europe%2FParis&forecast_days=1')
      .then(function(r){return r.json()})
      .then(function(d){
        var c=d&&d.current?d.current:null;
        var lev=d&&d.daily&&d.daily.sunrise?hhmm(d.daily.sunrise[0]):null;
        var cou=d&&d.daily&&d.daily.sunset?hhmm(d.daily.sunset[0]):null;
        var ph=phase(lev,cou);
        var code=c&&c.weather_code!=null?c.weather_code:3;
        var prec=(precForce!==null)?precForce:(c&&c.precipitation!=null?c.precipitation:0);
        var pluieRe=c&&((c.rain||0)>0.05||(c.showers||0)>0.05||prec>0.05);
        var neigeRe=c&&((c.snowfall||0)>0||(c.temperature_2m!=null&&c.temperature_2m<=1.2&&pluieRe));
        var w;
        if(wxForce!==null) w=famille(wxForce);
        else if(neigeRe) w='neige';
        else if(pluieRe) w=(code>=95)?'orage':'pluie';
        else { w=famille(code); if(w==='clair'&&c&&(c.cloud_cover||0)>=80) w='nuageux'; }
        var etat;
        if(ph==='nuit') etat='nuit';
        else if((ph==='aube'||ph==='crepuscule')&&(w==='clair'||w==='nuageux')) etat=ph;
        else etat=w;
        applique(etat, rendu(ph,w));
      })
      .catch(function(){var ph=phase(null,null);applique(ph==='clair'?'clair':ph)});
  }
  meteo();
  setInterval(meteo,5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) meteo(); });
  addEventListener('focus',meteo);
})();
</script>
<script>
(function(){
  var vids=[].slice.call(document.querySelectorAll('.media video'));
  function charge(v){ if(v.readyState<2){ try{ v.load(); }catch(e){} } }
  function joue(v){ charge(v); var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  function pose(v){ if(!v.paused) v.pause(); }
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ joue(e.target); } else { pose(e.target); } });
    },{rootMargin:'400px 0px',threshold:0.01});
    vids.forEach(function(v){ io.observe(v); });
  } else { vids.forEach(joue); }
  ['pointerdown','touchstart','keydown','scroll'].forEach(function(e){
    addEventListener(e,function(){ vids.forEach(joue); },{once:true,passive:true});
  });
  setTimeout(function(){ vids.slice(0,3).forEach(joue); },600);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) vids.forEach(pose); });
})();
</script>
<script>
(function(){var sw=window.innerWidth-document.documentElement.clientWidth;
  if(sw>0)document.documentElement.style.setProperty('--sbw',sw+'px');})();
</script>
